<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="dark-mode.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="primary-nav" aria-label="Primary navigation">
            <a href="index.html" aria-current="page">Home</a>
            <a href="resume/index.html">Resume</a>
            <a href="projects/index.html">Projects</a>
        </nav>
        <button id="dark-mode-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon theme-icon-sun">
                <i data-lucide="sun"></i>
            </span>
            <span class="theme-icon theme-icon-moon">
                <i data-lucide="moon"></i>
            </span>
        </button>
    </header>
    <main class="main-content">
        <section class="about-section" aria-labelledby="about-title">
            <div class="about-copy">
                <h1 id="about-title" class="text-title text-balance">About me</h1>
                <div class="text-flow">
                    <p class="text-lead text-pretty">Hi, I'm Ben, a web developer and Information Technology student at Arcada University of Applied Sciences.</p>
                    <p class="text-body text-muted">I've been programming for about seven years. Alongside my work in web development, I like to work on a wide array of side-projects in my freetime.</p>
                </div>
            </div>
            <div class="about-gallery" aria-label="Photos of me">
                <figure class="about-photo-frame">
                    <img class="about-photo" src="sitting-outdoors-by-the-sea.JPEG" alt="Me sitting outdoors by the sea" width="1200" height="1600">
                </figure>
                <figure class="about-photo-frame">
                    <img class="about-photo" src="standing-on-a-cliff-on-the-beach.JPEG" alt="Me standing on a cliff on the beach" width="1200" height="1600" loading="lazy">
                </figure>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons({
            attrs: {
                'aria-hidden': 'true',
                'stroke-width': 2,
            },
        });
    </script>
</body>
</html>
